<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Services</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      background: #f3f6f8;
      color: #203040;
    }

    .site-header {
      text-align: center;
      padding: 24px 16px;
      background: #16324f;
      color: white;
    }

    .container {
      width: 100%;
      padding: 16px;
      margin: 0 auto;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    @media (min-width: 600px) {
      .container {
        max-width: 900px;
        padding: 24px;
      }

      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 900px) {
      .container {
        max-width: 1100px;
      }

      .cards {
        grid-template-columns: repeat(3, 1fr);
      }
    }

  </style>
</head>

<body>
  <header class="site-header">
    <h1>Our Services</h1>
    <p>Simple solutions for your needs</p>
  </header>

  <main class="container">
    <section class="cards">
      <article class="card">
        <h2>Web Design</h2>
        <p>Clean, user-friendly website layouts.</p>
      </article>
      <article class="card">
        <h2>Development</h2>
        <p>Responsive pages built for different screens.</p>
      </article>
      <article class="card">
        <h2>Support</h2>
        <p>Help keeping your website working well.</p>

      </article>
    </section>
  </main>
</body>

</html>
