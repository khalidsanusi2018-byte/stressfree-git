<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive image practice</title>
<style>
.photo-box {
width: 90%;
max-width: 700px;
margin: 30px auto;
}
.photo-box img {
max-width: 100%;
height: auto;
display: block;
}
</style>
</head>
<body>
<div class="photo-box">
<img src="home2.jpg" alt="A bright shortlet apartment">
</div>
</body>
</html>
