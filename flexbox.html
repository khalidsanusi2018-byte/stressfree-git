<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid Practice</title>
  <style>
    .grid-item {
      background-color: aqua;
      border: 2px solid black;
      font-size: 2rem;
    
    }

    .grid-container {
      display: grid;
      grid-template-columns: 200px 200px;
      grid-template-rows: 300px auto 200px;
       justify-content: center;
      align-content: center;
      align-items: center;
      grid-template-areas: "header header"
      "nav nav"
      "sidebar main"
      "footer footer";
    }

    .grid-item-1{
grid-area: footer;
grid-template-columns: 1fr;
    }

    
    .grid-item-3{
grid-area: main;
grid-template-columns: 1fr;
grid-template-rows: 300px;
    }

    
    .grid-item-5{
grid-area: header;
grid-template-columns: 1fr;
grid-template-rows: 300px;
    }

    
    .grid-item-2{
grid-area: nav;
grid-template-columns: 1fr;
    }

      
    .grid-item-4{
grid-area: sidebar;
grid-template-columns: 1fr;
grid-template-rows: 200px;
    }

    @media (max-width:42em) {
.grid-container{ grid-template-columns: 200px;
      grid-template-rows: 200px auto 200px;

      }
    }
  </style>
</head>

<body>
  <div class="grid-container">
    <div class="grid-item grid-item-1">1</div>
    <div class="grid-item grid-item-2">2</div>
    <div class="grid-item grid-item-3">3</div>
    <div class="grid-item grid-item-4">you see header right</div>
    <div class="grid-item grid-item-5">This is what footer works for</div>
  </div>




</body>

</html>
